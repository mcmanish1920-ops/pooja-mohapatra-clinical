<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customize | Pooja Mohapatra</title><link rel="stylesheet" href="css/style.css"></head><body><main class="section"><div class="container" style="max-width:800px"><p class="eyebrow">WEBSITE EDITOR</p><h1 style="font:500 55px 'Playfair Display',serif">Customize the practice site.</h1><p class="muted">For permanent published changes, edit <b>config.js</b>. This page provides a quick browser preview editor for key identity and hero fields.</p><form id="editor" style="background:#fffdf8;padding:30px;border:1px solid var(--line);border-radius:var(--radius)"><label>Name<input id="name"></label><label>Designation<input id="designation"></label><label>Hero heading<input id="heading"></label><label>Hero highlight<input id="highlight"></label><label>Hero description><textarea id="description" rows="4"></textarea></label><label>Primary color<input id="primary" type="color"></label><button class="pill dark" type="submit">Save Preview</button> <a class="pill outline" href="index.html">View Website</a><button class="pill outline" id="reset" type="button">Reset</button></form></div></main><script src="config.js"></script><script>const c=SITE_CONFIG,s=id=>document.getElementById(id);s('name').value=c.professional.name;s('designation').value=c.professional.designation;s('heading').value=c.hero.heading;s('highlight').value=c.hero.highlight;s('description').value=c.hero.description;s('primary').value=c.appearance.primary;document.getElementById('editor').onsubmit=e=>{e.preventDefault();const x=JSON.parse(localStorage.getItem('poojaSiteConfigV10')||'{}');x.professional={...(x.professional||{}),name:s('name').value,designation:s('designation').value};x.hero={...(x.hero||{}),heading:s('heading').value,highlight:s('highlight').value,description:s('description').value};x.appearance={...(x.appearance||{}),primary:s('primary').value};localStorage.setItem('poojaSiteConfigV10',JSON.stringify(x));alert('Saved for this browser.');};s('reset').onclick=()=>{localStorage.removeItem('poojaSiteConfigV10');location.reload()};</script></body></html>
